  </g>
  <line x1="992" y1="312" x2="992" y2="294" stroke="#3fb950" stroke-width="2"/>

  <!-- wordmark -->
  <text x="56" y="168" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="80" font-weight="700" fill="#e6edf3" letter-spacing="-2">llm-tune</text>
