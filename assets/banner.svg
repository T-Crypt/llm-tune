  <!-- budget bar: right block, 596px = 24.564 gib measured card -->
  <text x="628" y="84" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#8b949e">what a 24 gib card actually holds at 131k ctx</text>

  <!-- bar y=100 h=54 -->
  <rect x="628" y="100" width="327" height="54" fill="#58a6ff"/>
  <rect x="955" y="100" width="103" height="54" fill="#3fb950"/>
  <rect x="1058" y="100" width="69" height="54" fill="#d29922"/>
  <rect x="1127" y="100" width="21" height="54" fill="#f778ba"/>
