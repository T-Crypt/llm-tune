  <text x="1064" y="123" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#0d1117">compute</text>
  <text x="1064" y="144" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#0d1117">2.85</text>

  <!-- leader labels: mmproj left of its tick, draft right of its tick, same row -->
  <line x1="1137" y1="154" x2="1137" y2="168" stroke="#f778ba" stroke-width="1"/>
  <line x1="1153" y1="154" x2="1153" y2="168" stroke="#bc8cff" stroke-width="1"/>
  <text x="1147" y="186" text-anchor="end" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#f778ba">mmproj .87</text>
  <text x="1160" y="186" text-anchor="start" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#bc8cff">draft .42</text>
  <text x="1224" y="206" text-anchor="end" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#8b949e">headroom 2.67</text>

  <!-- axis -->
  <line x1="628" y1="224" x2="1224" y2="224" stroke="#21262d" stroke-width="1"/>
  <text x="628" y="244" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">0</text>
  <text x="1224" y="244" text-anchor="end" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">24.56 gib</text>

  <!-- measured annotation -->
  <text x="628" y="278" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#e6edf3">the file alone is not the budget</text>
  <text x="628" y="298" font-family="'JetBrainsMono Nerd Font Mono','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">peak 21.89 / 24.56 gib, one measured run, rtx 4090 class</text>
</svg>